<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Data Table with TailwindCSS &amp; AlpineJS</title>
  <script src="https://cdn.tailwindcss.com/3.4.1"></script>

</head>

<body>

  <body class="antialiased sans-serif bg-gray-100">
    <div class="container mx-auto px-4" x-data="datatables()" x-cloak>
      <div x-show="selectedUsers.length" class="bg-indigo-200 fixed top-4 right-4 z-40 w-1/4 shadow">
        <div class="container mx-auto px-4 py-4">
          <div class="flex md:items-center">
            <div class="mr-4 flex-shrink-0">
              <svg class="h-8 w-8 text-indigo-600" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                  d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                  clip-rule="evenodd" />
              </svg>
            </div>
            <div x-html="selectedUsers.length + ' rows are selected'" class="text-indigo-800 text-lg"></div>
            <button @click="selectedUsers.map(user => user.selected = false)"
              class="ml-4 text-indigo-600 hover:text-indigo-800 focus:outline-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <rect x="0" y="0" width="24" height="24" stroke="none"></rect>
                <path d="M18 18v-6a6 6 0 0 0 -12 0v6a6 6 0 0 0 12 0z"></path>
                <path d="M12 4v-1m0 16v1m8-9h1m-16 0h1"></path>
                <path d="M6.343 6.343l-.707-.707m12.727 0l-.707.707m-11.313 11.313l.707.707m11.313 0l.707-.707"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="border-b mb-4">
        <h1 class="text-3xl py-3 mb-2">Datatable</h1>
        <p class="text-gray-600 mb-6">A dynamic and reusable datatable component built with Alpine.js and Tailwind CSS. All the data is fetched from a local JSON file and the table is generated dynamically.</p>
      </div>
      <div class="mb-4 flex justify-between items-center">

        <div class="flex-1 pr-4">
          <div class="relative md:w-1/3">
            <input type="search" x-model="search"
              class="w-full pl-10 pr-4 py-2 rounded-lg shadow focus:outline-none focus:shadow-outline text-gray-600 font-medium"
              placeholder="Search...">
            <div class="absolute top-0 left-0 inline-flex items-center p-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-400" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <rect x="0" y="0" width="24" height="24" stroke="none"></rect>
                <circle cx="10" cy="10" r="7" />
                <line x1="21" y1="21" x2="15" y2="15" />
              </svg>
            </div>
            <div x-show="search.length" class="absolute top-0 right-0 inline-flex items-center p-2">
              <button @click="search = ''" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="0" y="0" width="24" height="24" stroke="none"></rect>
                  <line x1="18" y1="6" x2="6" y2="18" />
                  <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div>
          <div class="shadow rounded-lg flex">
            <div class="relative">
              <button @click.prevent="open = !open"
                class="rounded-lg inline-flex items-center bg-white hover:text-blue-500 focus:outline-none focus:shadow-outline text-gray-500 font-semibold py-2 px-2 md:px-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 md:hidden" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="0" y="0" width="24" height="24" stroke="none"></rect>
                  <path d="M5.5 5h13a1 1 0 0 1 0.5 1.5L14 12L14 19L10 16L10 12L5 6.5a1 1 0 0 1 0.5 -1.5" />
                </svg>
                <span class="hidden md:block">Display</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 ml-1" width="24" height="24" viewBox="0 0 24 24"
                  stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="0" y="0" width="24" height="24" stroke="none"></rect>
                  <polyline points="6 9 12 15 18 9" />
                </svg>
              </button>

              <div x-show="open" @click.away="open = false"
                class="z-40 absolute top-0 right-0 w-40 bg-white rounded-lg shadow-lg mt-12 -mr-1 block py-1 overflow-hidden">
                <template x-for="heading in headings">
                  <label class="flex justify-start items-center text-truncate hover:bg-gray-100 px-4 py-2">
                    <div class="text-blue-600 mr-3">
                      <input type="checkbox" class="form-checkbox focus:outline-none focus:shadow-outline" checked
                        @click="toggleColumn(heading.key)">
                    </div>
                    <div class="select-none text-gray-700" x-text="heading.value"></div>
                  </label>
                </template>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="overflow-x-auto bg-white rounded-lg shadow overflow-y-auto relative" style="height: 405px;">
        <table class="border-collapse table-auto w-full whitespace-nowrap bg-white table-striped relative">
          <thead>
            <tr class="text-left">
              <th class="py-2 px-3 sticky top-0 border-b border-indigo-200 bg-indigo-100">
                <label
                  class="text-indigo-500 inline-flex justify-between items-center hover:bg-gray-300 px-2 py-2 rounded-lg cursor-pointer">
                  <input type="checkbox" class="form-checkbox focus:outline-none focus:shadow-outline"
                    @click="selectAllCheckbox($event);">
                </label>
              </th>
              <template x-for="heading in headings">
                <th
                  class="bg-indigo-100 sticky top-0 border-b border-indigo-200 px-6 py-2 text-gray-700 font-bold tracking-wider uppercase text-xs"
                  x-text="heading.value" x-show="columns.includes(heading.key)"></th>
              </template>
            </tr>
          </thead>
          <tbody>
            <template x-for="user in filteredUsers" :key="user.userId">
              <tr>
                <td class="border-dashed border-t border-gray-300 px-3">
                  <label
                    class="text-blue-500 inline-flex justify-between items-center hover:bg-gray-200 px-2 py-2 rounded-lg cursor-pointer">
                    <input type="checkbox" x-model="user.selected"
                      class="form-checkbox rowCheckbox focus:outline-none focus:shadow-outline" :name="user.userId">
                  </label>
                </td>
                <template x-for="heading in headings" :key="heading.key">
                  <td class="border-dashed border-t border-gray-300" x-show="columns.includes(heading.key)">
                    <span class="text-gray-700 px-6 py-3 flex items-center" x-text="user[heading.key]"></span>
                  </td>
                </template>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Alpine Plugins -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.x.x/dist/cdn.min.js"></script>

    <!-- Alpine Core -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  </body>

</html>
<script src="./script.js"></script>

</body>

</html>
